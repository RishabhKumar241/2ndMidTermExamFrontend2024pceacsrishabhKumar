<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Strength Meter</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; }
  .card { width: 320px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h2 { text-align: center; }
  #pwd { width: 100%; padding: 8px; box-sizing: border-box; font-size: 16px; }
  .bar-bg { height: 8px; background: #ddd; border-radius: 5px; margin-top: 10px; }
  #bar { height: 100%; width: 0; border-radius: 5px; transition: width .3s, background .3s; }
  #label { font-size: 14px; margin: 6px 0 10px; min-height: 18px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 5px 0; color: grey; font-size: 14px; }
  li.ok { color: green; }
</style>
</head>
<body>
<div class="card">
  <h2>Password Strength</h2>
  <input type="password" id="pwd" placeholder="Enter password">
  <label><input type="checkbox" id="showPwd"> Show password</label>

  <div class="bar-bg"><div id="bar"></div></div>
  <div id="label"></div>

  <ul id="rules"></ul>
</div>

<script>
  const pwd = document.getElementById("pwd");
  const showPwd = document.getElementById("showPwd");
  const bar = document.getElementById("bar");
  const label = document.getElementById("label");
  const rulesList = document.getElementById("rules");

  const rules = [
    { text: "At least 8 characters", test: p => p.length >= 8 },
    { text: "One uppercase letter",  test: p => /[A-Z]/.test(p) },
    { text: "One lowercase letter",  test: p => /[a-z]/.test(p) },
    { text: "One number",            test: p => /[0-9]/.test(p) },
    { text: "One special symbol (@, #, $, !)", test: p => /[^A-Za-z0-9]/.test(p) }
  ];

  function checkPassword() {
    const p = pwd.value;
    let passed = 0;
    rulesList.innerHTML = "";

    rules.forEach(rule => {
      const ok = rule.test(p);
      if (ok) passed++;
      const li = document.createElement("li");
      li.className = ok ? "ok" : "";
      li.textContent = (ok ? "✓ " : "✗ ") + rule.text;
      rulesList.appendChild(li);
    });

    bar.style.width = (passed / 5 * 100) + "%";
    if (p === "" || passed === 0) {
      bar.style.background = "#ddd";
      label.textContent = "";
    } else if (passed <= 2) {
      bar.style.background = "red";
      label.textContent = "Weak";
    } else if (passed <= 4) {
      bar.style.background = "orange";
      label.textContent = "Medium";
    } else {
      bar.style.background = "green";
      label.textContent = "Strong";
    }
  }

  pwd.addEventListener("input", checkPassword);

  showPwd.addEventListener("change", function () {
    pwd.type = showPwd.checked ? "text" : "password";
  });

  checkPassword();
</script>
</body>
</html>
